<!DOCTYPE html>
<!-- Página puente del login de las apps de Android: Google/Supabase vuelve aquí (con la sesión en #…) y esta página reabre la app con su esquema (games.fansof.<juego>://login#…). Sin ella el navegador se quedaba en la web. -->
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex">
<title>Volver a la app · Fans Of</title>
<link rel="icon" href="../core/img/fog-192.png">
<link rel="stylesheet" href="../core/fuentes/baloo-2.css">
<link rel="stylesheet" href="../core/fuentes/luckiest-guy.css">
<link rel="stylesheet" href="../core/css/base.css">
<link rel="stylesheet" href="../estilo/web.css">
<link rel="stylesheet" href="app-login.css">
<script src="../core/js/nucleo.js?v=0-a1516.a923ff1"></script>
<script src="../core/js/sistema/flags.js"></script>
<script src="../estilo/estilo-nuevo.js"></script>
</head><body><main>
  <h1 id="t">Volviendo a la app…</h1>
  <p id="p">Si no se abre sola, toca el botón.</p>
  <a id="b" class="boton" href="#">VOLVER A LA APP</a>
</main>
<script src="../idioma-web.js"></script>
<script>
'use strict';
(function () {
  const en = IDIOMA_WEB.elegido() === 'en';
  const app = new URLSearchParams(location.search).get('app') || '';
  const q = id => document.getElementById(id);
  if (en) { q('t').textContent = 'Going back to the app…'; q('p').textContent = "If it doesn't open by itself, tap the button."; q('b').textContent = 'BACK TO THE APP'; document.documentElement.lang = 'en'; }
  if (!/^games\.fansof\.[a-z]+$/.test(app)) { q('t').textContent = en ? 'Invalid link' : 'Enlace no válido'; q('p').textContent = ''; q('b').hidden = true; return; }
  const destino = app + '://login' + location.hash;   // la sesión (tokens) viaja en el # y solo hasta la app
  q('b').href = destino;
  location.replace(destino);
})();
</script></body></html>
