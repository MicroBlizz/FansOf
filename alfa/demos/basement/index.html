<style>
/* Fans of Basement: un solo canvas vertical (360 de ancho lógico) centrado en la pantalla. */
html, body { height: 100%; margin: 0; background: #2a3250; overflow: hidden; overscroll-behavior: none; }
body { -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; touch-action: none; }
#juego { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); display: block; touch-action: none; image-rendering: pixelated; }
#carga { position: fixed; inset: 0; display: grid; place-items: center; color: #ffe14a; font: 800 18px/1 'Baloo 2', sans-serif; }
[hidden] { display: none !important; }
</style>
</head>
<body>
<canvas id="juego" aria-label="Fans of Basement"></canvas>
<div id="carga">…</div>
<div id="toast"></div>
<script>
NUCLEO.juego({
  ligero: true,   // solo la cuenta, el idioma y el sonido de core: Basement guarda en el navegador sus monedas, mejoras y récord
  antes: ['js/ajustes.js'],
  idioma: { en: ['idioma/en.js'] },
  despues: [
    '../../core/js/serie/canciones.js',
    'js/progreso.js', 'js/bajada.js', 'js/enemigos.js', 'js/arma.js',
    'js/guardado.js', 'js/sonido.js', 'js/sprites.js', 'js/efectos.js', 'js/vista.js', 'js/pantallas.js', 'js/mesa.js', 'js/dev.js', 'js/principal.js'],
});
</script>
</body>
