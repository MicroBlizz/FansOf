<!-- Fans of Beams · demo. Todo el juego vive en este archivo. Reutiliza de Fans of Nova TODO el arte (games/nova/arte: naves de las 9 facciones con sus
     seis clases, enemigos, jefes, asteroides, iconos) y la música y el sonido (motor de core y canciones de games/nova/js/musica.js, creados con código). -->
<script src="../../core/js/serie/canciones.js"></script>
<script src="../../core/js/sistema/sonido.js"></script>

<script>
'use strict';
/* =====================================================================================================================================
   FANS OF BEAMS · matamarcianos horizontal con captura de enemigos al estilo de G-Darius (PlayStation).
   Copia de G-Darius: la bola de captura convierte en aliado a un enemigo común (los fuertes hay que debilitarlos antes); el aliado se queda
   a tu lado, dispara a su manera y hace de escudo; y con el botón de rayo se sacrifica y sale un rayo gigante. Como en la serie Darius,
   el fondo está lleno de cosas enormes: planetas, lunas, meteoritos y naves gigantes que cruzan despacio.
   ===================================================================================================================================== */
const W = 960, H = 540, A = '../../games/nova/arte/';
const CAPITAN_PROG = 2200, MAX_BOLAS = 3, SECTORES = 3;
const maxAli = () => 2 + (S.k >= 3 ? 1 : 0);   // la tercera plaza de escolta se abre con la clase Crucero pesado
const cv = document.getElementById('c');
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
let Rk = 1, RkMax = 2;   // resolución del lienzo final respecto a 960x540: la escena se dibuja pequeña (rápido) y el texto y los menús, nítidos
const TXTC = new Map(), TQ = [];
function ajusta() {
  const k = Math.min(innerWidth / W, innerHeight / H); cv.style.width = W * k + 'px'; cv.style.height = H * k + 'px';
  const q = Math.round(clamp(k * (window.devicePixelRatio || 1), 1, RkMax) * 4) / 4;
  if (q !== Rk || cv.width !== Math.round(W * q)) { Rk = q; cv.width = Math.round(W * Rk); cv.height = Math.round(H * Rk); TXTC.clear(); }
}
// la escena se dibuja en un lienzo aparte para poder darle brillo (bloom) antes de ponerla en pantalla
const esc = document.createElement('canvas'); esc.width = W; esc.height = H;
const b1 = document.createElement('canvas'); b1.width = 240; b1.height = 135;
const b2 = document.createElement('canvas'); b2.width = 96; b2.height = 54;
const escC = esc.getContext('2d');
let c = escC;
const lienzo = (w, h) => { const o = document.createElement('canvas'); o.width = w; o.height = h; return o; };

// ---------- sonido: lo que pide el motor de core ----------
let mudo = false;
function sonidoApagado() { return mudo; }
function volGeneral() { return mudo ? 0 : 0.55 * OPC.pant.vol; }
function volMusica() { return 0.7 * OPC.pant.mus; }
function musicUpdate() { /* la canción se elige desde la partida */ }

// ---------- las 9 facciones de la serie: su nave, sus enemigos y su color ----------
const FACS = {
  animales: { nom: 'Animales', casco: 'caza', base: 'caza', col: '#ffa94a', pil: 'cap-bunny' },
  nomuertos: { nom: 'No-Muertos', casco: 'nomuertos', base: 'fragata', col: '#9be36a', pil: 'cap-necrolord' },
  streamers: { nom: 'Streamers', casco: 'streamers', base: 'caza', col: '#b46bff', pil: 'cap-twitchking' },
  heroes: { nom: 'Héroes', casco: 'heroes', base: 'crucero', col: '#ffd23c', pil: 'cap-epicchampion' },
  ciber: { nom: 'Ciber', casco: 'crucero', base: 'crucero', col: '#46d2ff', pil: 'cap-cybermarine' },
  memes: { nom: 'Memes', casco: 'memes', base: 'caza', col: '#ff8ad8', pil: 'cap-memelord' },
  gamer: { nom: 'Gamers', casco: 'gamer', base: 'fragata', col: '#5cff9a', pil: 'cap-progamer' },
  olvidados: { nom: 'Olvidados', casco: 'fragata', base: 'fragata', col: '#d9c7a6', pil: 'cap-vikingo' },
  pop: { nom: 'Pop', casco: 'pop', base: 'crucero', col: '#ff5ad8', pil: 'cap-directora' }
};
const ORDEN_FAC = Object.keys(FACS);
const RAYOCOL = { animales: '#ff8a1a', nomuertos: '#4cff2a', streamers: '#a040ff', heroes: '#ffb000', ciber: '#1aa8ff', memes: '#ff30c0', gamer: '#20ff80', olvidados: '#ff5a3a', pop: '#ff2a9a' };   // color intenso del rayo de cada facción
const BASEH = { caza: { al: -26, mo: 84, L: false }, crucero: { al: -50, mo: 88, L: false }, fragata: { al: -30, mo: 94, L: true } };   // anclajes de datos-piezas.js
const NOMBRE_CLASE = ['Caza', 'Corbeta', 'Fragata', 'Crucero pesado', 'Acorazado', 'Nave jefe'];

// ---------- imágenes (se cargan al pedirlas) ----------
const IMGS = {};
function img(ruta) { let i = IMGS[ruta]; if (!i) { i = IMGS[ruta] = new Image(); i.src = A + ruta; } return i; }
const listo = i => i && i.complete && i.naturalWidth > 0;
const spriteE = (fac, t) => img('enemigos/' + (fac === 'nomuertos' ? '' : fac + '-') + t + '.png');
const precarga = f => { for (const t of ['rastrero', 'fusilero', 'sepulturero', 'capitan', 'nido', 'jefe']) spriteE(f, t); };
precarga('nomuertos');
for (let i = 1; i <= 7; i++) img('enemigos/asteroide' + (i > 1 ? '-' + i : '') + '.png');
for (const f of ORDEN_FAC) img('iconos/' + FACS[f].pil + '.png');
for (const n of ['arma-laser', 'arma-rayoSolar', 'carga-energia', 'sis-casco']) img('iconos/' + n + '.png');
let PZ = null;
fetch(A + 'piezas.json').then(r => r.json()).then(d => { PZ = {}; for (const p of d.piezas) PZ[p.id] = p; }).catch(() => { PZ = {}; });
// copia oscurecida de un sprite (para las naves gigantes del fondo: se ven lejos, entre la niebla)
const OSCUROS = {};
function oscuro(im, a) {
  if (!listo(im)) return null; const k = im.src + a; if (OSCUROS[k]) return OSCUROS[k];
  const o = lienzo(im.naturalWidth, im.naturalHeight), g = o.getContext('2d'); g.drawImage(im, 0, 0); g.globalCompositeOperation = 'source-atop'; g.fillStyle = 'rgba(8,12,34,' + a + ')'; g.fillRect(0, 0, o.width, o.height); return OSCUROS[k] = o;
}

// La nave del jugador: casco, alas y motor de Nova, colocados como en el juego (anclajes de la clase), girados para mirar a la derecha.
const NAVES = {};
function nave(fac, k) {
  const clave = fac + k; if (NAVES[clave]) return NAVES[clave];
  if (!PZ) return null;
  const F = FACS[fac], B = BASEH[F.base], idC = n => F.casco + '-casco' + (n ? '-c' + (n + 1) : ''), idA = n => F.casco + '-alas' + (n ? '-c' + (n + 1) : '');
  let kk = k; if (!PZ[idC(kk)] || !PZ[idA(kk)]) kk = 0;
  const ids = [idC(0), idC(kk), idA(0), idA(kk)]; if (!PZ[ids[0]] || !PZ[ids[2]]) return null;
  const tam = 'motor-' + (kk >= 4 ? 'triple' : kk >= 2 ? 'doble' : 'simple') + '-' + (B.L ? (kk >= 2 ? 'L' : 'M') : (kk >= 2 ? 'M' : 'S'));
  for (const id of ids.concat([tam])) if (!PZ[id] || !listo(img(PZ[id].archivo))) return null;   // aún sin cargar: se reintenta
  const h1 = PZ[idC(0)], hk = PZ[idC(kk)], top1 = -h1.pivote[1] / 2, lon1 = h1.alto / 2, topk = -hk.pivote[1] / 2, lonk = hk.alto / 2;
  const alasY = kk ? topk + (B.al - top1) / lon1 * lonk : B.al, motorY = kk ? B.mo + (hk.alto - hk.pivote[1]) / 2 - (h1.alto - h1.pivote[1]) / 2 : B.mo;
  const g0 = lienzo(1000, 1300), g = g0.getContext('2d'), ox = 500, oy = 700;
  const pz = (id, ax, ay) => { const m = PZ[id]; g.drawImage(img(m.archivo), ox + ax - m.pivote[0] / 2, oy + ay - m.pivote[1] / 2, m.ancho / 2, m.alto / 2); };
  pz(idA(kk), 0, alasY); pz(tam, 0, motorY); pz(idC(kk), 0, 0);
  // recorta lo dibujado, gira y reduce
  const d = g.getImageData(0, 0, 1000, 1300).data; let x0 = 1e9, y0 = 1e9, x1 = -1, y1 = -1;
  for (let y = 0; y < 1300; y += 2) for (let x = 0; x < 1000; x += 2) if (d[(y * 1000 + x) * 4 + 3] > 20) { if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; }
  const bw = x1 - x0 + 2, bh = y1 - y0 + 2, r = lienzo(bh, bw), rg = r.getContext('2d');
  rg.translate(bh, 0); rg.rotate(Math.PI / 2); rg.drawImage(g0, x0, y0, bw, bh, 0, 0, bw, bh);
  const largo = 74 + k * 9, sc = largo / bh, tw = Math.round(bh * sc), th = Math.round(bw * sc);
  const out = lienzo(tw, th), og = out.getContext('2d'); og.imageSmoothingQuality = 'high'; og.drawImage(r, 0, 0, tw, th);
  return NAVES[clave] = out;
}

// ---------- opciones guardadas: controles, táctil, pantalla y sonido ----------
const OPC_CLAVE = 'fobeams-opciones';
const ACCIONES = [['arr', 'Arriba'], ['abj', 'Abajo'], ['izq', 'Izquierda'], ['der', 'Derecha'], ['disp', 'Disparar'], ['capt', 'Bola de captura'], ['rayo', 'Super rayo'], ['pausa', 'Pausa']];
const DEF = {
  teclas: { arr: ['ArrowUp', 'w'], abj: ['ArrowDown', 's'], izq: ['ArrowLeft', 'a'], der: ['ArrowRight', 'd'], disp: ['z', ' '], capt: ['x', null], rayo: ['c', null], pausa: ['p', 'Escape'] },
  pad: { disp: 0, capt: 2, rayo: 3, pausa: 9 },   // mando estándar: A, X, Y, Start (el movimiento va con el stick y la cruceta)
  tactil: { modo: 'auto', auto: true, escala: 1, opac: 0.6, vib: true, pos: { stick: [0.13, 0.7], disp: [0.9, 0.74], capt: [0.78, 0.86], rayo: [0.8, 0.6], pausa: [0.3, 0.07] } },
  pant: { cal: 'auto', bloom: true, sacudida: true, mus: 0.5, vol: 0.8, fps: false }
};
const clona = o => JSON.parse(JSON.stringify(o));
let OPC = clona(DEF);
try { const g = JSON.parse(localStorage.getItem(OPC_CLAVE) || 'null'); if (g) { for (const k in DEF) if (g[k]) OPC[k] = Object.assign(OPC[k], g[k]); if (g.tactil && g.tactil.pos) OPC.tactil.pos = Object.assign(clona(DEF.tactil.pos), g.tactil.pos); } } catch (e) { /* sin almacenamiento */ }
function guardaOpc() { try { localStorage.setItem(OPC_CLAVE, JSON.stringify(OPC)); } catch (e) { /* vale hasta cerrar */ } if (typeof AC !== 'undefined' && AC) applyVolume(); fijaCal(); }
const ENAPP = !!window.Capacitor;
const NOM_PAD = ['A', 'B', 'X', 'Y', 'LB', 'RB', 'LT', 'RT', 'SELECT', 'START', 'L3', 'R3', 'ARRIBA', 'ABAJO', 'IZQ.', 'DCHA.', 'HOME'];
const nombrePad = i => i == null ? '—' : 'BOTÓN ' + (NOM_PAD[i] || i);
function nombreTecla(k) { if (!k) return '—'; const m = { ' ': 'ESPACIO', ArrowUp: 'FLECHA ARR.', ArrowDown: 'FLECHA ABA.', ArrowLeft: 'FLECHA IZQ.', ArrowRight: 'FLECHA DER.', Escape: 'ESC', Enter: 'ENTER', Shift: 'SHIFT', Control: 'CTRL', Alt: 'ALT', Tab: 'TAB', Backspace: 'RETROC.' }; return m[k] || k.toUpperCase(); }

const KEYS = {}, FIJA = {}, KH = {}, PH = {}, TH = {}, PREV = {}, PU = {}, PAD = { mx: 0, my: 0, hay: false, prev: [] }, TV = { x: 0, y: 0 };
let ESPERA = null;   // casilla de controles esperando una tecla o un botón: { tipo: 'tecla' | 'pad', id, n }
const normaliza = e => e.key.length === 1 ? e.key.toLowerCase() : e.key;
function asignaTecla(k) {
  const { id, n } = ESPERA; ESPERA = null;
  if (k === 'Escape') return;
  if (k === 'Delete' || k === 'Backspace') { OPC.teclas[id][n] = null; guardaOpc(); return; }
  for (const a of ACCIONES) OPC.teclas[a[0]] = OPC.teclas[a[0]].map(t => t === k ? null : t);   // una tecla, una sola acción
  OPC.teclas[id][n] = k; guardaOpc();
}
function asignaPad(i) {
  const { id } = ESPERA; ESPERA = null;
  for (const a in OPC.pad) if (OPC.pad[a] === i) OPC.pad[a] = null;
  OPC.pad[id] = i; guardaOpc();
}
addEventListener('keydown', e => {
  const k = normaliza(e); if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', ' ', 'Tab'].includes(e.key)) e.preventDefault();
  audioInit();
  if (ESPERA) {
    if (ESPERA.tipo === 'tecla') { asignaTecla(k); e.preventDefault(); return; }
    if (k === 'Escape') ESPERA = null; else if (k === 'Delete' || k === 'Backspace') { OPC.pad[ESPERA.id] = null; ESPERA = null; guardaOpc(); }
    return;
  }
  if (!KEYS[k]) FIJA[k] = true; KEYS[k] = true;
});
addEventListener('keyup', e => { KEYS[normaliza(e)] = false; });
addEventListener('blur', () => { for (const k in KEYS) KEYS[k] = false; for (const k in TH) TH[k] = false; TOQ.clear(); });
function leePad() {
  const gps = navigator.getGamepads ? navigator.getGamepads() : []; let mx = 0, my = 0, hay = false; const ahora = [];
  for (const a of ACCIONES) PH[a[0]] = false;
  for (const g of gps) {
    if (!g || !g.connected) continue; hay = true;
    for (const a of ACCIONES) { const b = OPC.pad[a[0]]; if (b != null && g.buttons[b] && g.buttons[b].pressed) PH[a[0]] = true; }
    const ax = g.axes[0] || 0, ay = g.axes[1] || 0; if (Math.hypot(ax, ay) > 0.22) { mx += ax; my += ay; }
    const bp = i => g.buttons[i] && g.buttons[i].pressed; if (bp(14)) mx -= 1; if (bp(15)) mx += 1; if (bp(12)) my -= 1; if (bp(13)) my += 1;
    for (let i = 0; i < g.buttons.length; i++) if (g.buttons[i].pressed) ahora[i] = true;
  }
  if (ESPERA && ESPERA.tipo === 'pad') for (let i = 0; i < ahora.length; i++) if (ahora[i] && !PAD.prev[i]) { asignaPad(i); break; }
  PAD.prev = ahora; PAD.hay = hay; PAD.mx = clamp(mx, -1, 1); PAD.my = clamp(my, -1, 1);
  if (PAD.mx < -0.5) PH.izq = true; if (PAD.mx > 0.5) PH.der = true; if (PAD.my < -0.5) PH.arr = true; if (PAD.my > 0.5) PH.abj = true;   // en los menús, el stick equivale a las flechas
}
function refresca() {   // una vez por cuadro: junta teclado, mando y táctil en acciones
  leePad();
  for (const a of ACCIONES) { const id = a[0]; KH[id] = OPC.teclas[id].some(k => k && KEYS[k]); const on = !!(KH[id] || PH[id] || TH[id]); if (on && !PREV[id]) PU[id] = true; PREV[id] = on; }
  TV.x = TV.y = 0;
  for (const t of TOQ.values()) if (t.tipo === 'stick') { const R = 70 * OPC.tactil.escala, dx = t.x - t.cx, dy = t.y - t.cy, d = Math.hypot(dx, dy), m = clamp((d / R - 0.15) / 0.85, 0, 1); if (d > 0) { TV.x = dx / d * m; TV.y = dy / d * m; } }
}
const act = id => PREV[id];

// táctil: palanca flotante a la izquierda y botones a la derecha; arrastrar para colocarlos (opciones > táctil)
const TOQ = new Map(); let TACTIL = false;
try { TACTIL = matchMedia('(pointer:coarse)').matches; } catch (e) { /* sin matchMedia */ }
const mostrarTactil = () => OPC.tactil.modo === 'si' || (OPC.tactil.modo === 'auto' && TACTIL);
const autoFuego = () => mostrarTactil() && OPC.tactil.auto;
function botonesT() {
  const T = OPC.tactil, e = T.escala, o = {};
  for (const id of ['stick', 'disp', 'capt', 'rayo', 'pausa']) o[id] = { x: T.pos[id][0] * W, y: T.pos[id][1] * H, r: (id === 'stick' ? 72 : id === 'disp' ? 52 : id === 'pausa' ? 26 : 42) * e };
  return o;
}
function ptr(e) { const r = cv.getBoundingClientRect(); return { x: (e.clientX - r.left) / r.width * W, y: (e.clientY - r.top) / r.height * H }; }
cv.addEventListener('contextmenu', e => e.preventDefault());
cv.addEventListener('pointerdown', e => {
  e.preventDefault(); audioInit(); if (e.pointerType === 'touch') TACTIL = true;
  const p = ptr(e); try { cv.setPointerCapture(e.pointerId); } catch (x) { /* sin captura */ }
  if (S.estado === 'editaT') {   // arrastrar un botón
    const B = botonesT(); let mejor = null, dm = 1e9; for (const id in B) { const d = Math.hypot(p.x - B[id].x, p.y - B[id].y); if (d < B[id].r * 1.3 && d < dm) { dm = d; mejor = id; } }
    if (mejor) TOQ.set(e.pointerId, { tipo: 'arrastra', id: mejor }); else tocaUI(p); return;
  }
  if (S.estado === 'jugando' && mostrarTactil()) {
    const B = botonesT();
    for (const id of ['capt', 'rayo', 'disp', 'pausa']) { if (id === 'disp' && OPC.tactil.auto) continue; const b = B[id]; if (Math.hypot(p.x - b.x, p.y - b.y) < b.r * 1.25) { TOQ.set(e.pointerId, { tipo: 'btn', id }); TH[id] = true; return; } }
    if (p.x < W * 0.55) TOQ.set(e.pointerId, { tipo: 'stick', cx: p.x, cy: p.y, x: p.x, y: p.y });
    return;
  }
  tocaUI(p);
});
cv.addEventListener('pointermove', e => {
  const t = TOQ.get(e.pointerId); if (!t) return; const p = ptr(e);
  if (t.tipo === 'stick') { t.x = p.x; t.y = p.y; const R = 72 * OPC.tactil.escala * 1.4, dx = t.x - t.cx, dy = t.y - t.cy, d = Math.hypot(dx, dy); if (d > R) { t.cx += dx / d * (d - R); t.cy += dy / d * (d - R); } }
  else if (t.tipo === 'arrastra') OPC.tactil.pos[t.id] = [clamp(p.x / W, 0.05, 0.95), clamp(p.y / H, 0.08, 0.94)];
});
function suelta(e) {
  const t = TOQ.get(e.pointerId);
  if (t) { if (t.tipo === 'btn') TH[t.id] = false; if (t.tipo === 'arrastra') guardaOpc(); TOQ.delete(e.pointerId); }
  if (e.pointerType === 'touch') pantallaCompleta(false);
}
cv.addEventListener('pointerup', suelta); cv.addEventListener('pointercancel', suelta);
function tocaUI(p) {
  UI.teclado = false;
  if ((S.estado === 'fin' || S.estado === 'victoria') && S.fin > 0.8) { volverMenu(); return; }
  for (let i = UI.prev.length - 1; i >= 0; i--) { const h = UI.prev[i]; if (p.x >= h.x && p.x <= h.x + h.w && p.y >= h.y && p.y <= h.y + h.h) { h.fn(); return; } }
}
let fsPedida = false;
function pantallaCompleta(forzar) {   // en el navegador del móvil: pantalla completa y horizontal (en la app ya viene así)
  if (ENAPP) return; const d = document, el = d.documentElement;
  try { if (!d.fullscreenElement && (forzar || !fsPedida) && el.requestFullscreen) { fsPedida = true; const pr = el.requestFullscreen(); if (pr && pr.then) pr.then(() => { try { screen.orientation.lock('landscape').catch(() => {}); } catch (x) { /* sin bloqueo */ } }).catch(() => {}); } } catch (x) { /* no se puede */ }
}
let wake = null;
function pantallaEncendida() { try { if (navigator.wakeLock && !wake) navigator.wakeLock.request('screen').then(w => { wake = w; w.addEventListener('release', () => { wake = null; }); }).catch(() => {}); } catch (x) { /* sin wake lock */ } }
function vib(ms) { try { if (OPC.tactil.vib && navigator.vibrate) navigator.vibrate(ms); } catch (x) { /* sin vibración */ } }

// ---------- utilidades ----------
const rnd = (a, b) => a + Math.random() * (b - a), ang = (a, b) => Math.atan2(b.y - a.y, b.x - a.x), pick = l => l[Math.floor(Math.random() * l.length)];
function mezcla(col, t) {   // acerca un color hex a blanco (t>0) o a negro (t<0)
  let h = col.slice(1); if (h.length === 3) h = h[0] + h[0] + h[1] + h[1] + h[2] + h[2];
  const n = parseInt(h, 16), to = t > 0 ? 255 : 0, k = Math.abs(t);
  return 'rgb(' + [n >> 16, (n >> 8) & 255, n & 255].map(v => Math.round(v + (to - v) * k)).join(',') + ')';

// Estilo de letra: Orbitron (pesada y futurista) para casi todo, Audiowide para los títulos grandes, Michroma ancha para letra pequeña.

function dibujaTactil(edit) {

// ---------- calidad adaptable: si el móvil va justo, el juego baja solo de nivel (y no vuelve a subir a uno que ya le fue mal) ----------
let fpsEma = 60, ema = 0.0167, lentoT = 0, rapidoT = 0, ant = performance.now();

function fijaCal() {
  const m = OPC.pant.cal; Q = m === 'auto' ? CAL[calAuto] : CAL[{ baja: 0, media: 1, alta: 2 }[m]];

}
function adaptaCal(dt) {
  fpsEma += (1 / Math.max(dt, 0.001) - fpsEma) * 0.05; if (OPC.pant.cal !== 'auto' || S.estado !== 'jugando') { lentoT = rapidoT = 0; return; }
