<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#1a0f1f">
<title>Fans of Swipe</title>
<meta name="description" content="Fans of Swipe: sube la Torre de Microblizz con CrazyBunny deslizando cartas a la izquierda o a la derecha. Combates frenéticos, reliquias con combos y el CEO esperando arriba.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jersey+10&display=swap">
<!-- ?v= es la versión de la demo: súbela al publicar -->
<script src="../../core/js/nucleo.js?v=0.1.0-a626.5b339c4"></script>
<script>NUCLEO.estilos('../../core/css/base.css', '../../core/css/menus.css', 'css/swipe.css')</script>
</head>
<body>
<div id="stage">
  <canvas id="cv" width="540" height="960" aria-label="Fans of Swipe"></canvas>
  <div id="sw-ui">
    <section id="sw-titulo">
      <p class="sw-lema" id="sw-record"></p>
      <button class="sw-btn sw-enorme" id="sw-seguir" type="button" hidden>SEGUIR SUBIDA</button>
      <button class="sw-btn sw-enorme" id="sw-jugar" type="button">JUGAR</button>
      <div class="sw-fila">
        <button class="sw-btn2 sw-verde" id="sw-ayuda" type="button">CÓMO SE JUEGA</button>
        <button class="sw-btn2 sw-azul" id="sw-col" type="button">RELIQUIAS</button>
      </div>
      <button class="sw-btn2 sw-azul" id="sw-opc" type="button">OPCIONES</button>
    </section>
    <section id="sw-modal" class="sw-modal" hidden><div class="sw-tarjeta" id="sw-tarjeta"></div></section>
  </div>
</div>
<div id="carga">…</div>
<script>
NUCLEO.juego({
  ligero: true,   // solo la cuenta, el idioma y el sonido de core: Fans of Swipe lleva su propia partida y sus pantallas
  antes: ['js/ajustes.js'],
  idioma: { en: ['idioma/en.js'] },
  despues: [
    '../../core/js/serie/canciones.js',
    'js/guardado.js', 'js/sprites.js', 'js/efectos.js', 'js/sonidos.js', 'js/combate.js', 'js/ruta.js', 'js/partida.js',
    'js/pintar.js', 'js/carta.js', 'js/pantallas.js', 'js/novedades.js', 'js/principal.js'],
});
</script>

</html>
