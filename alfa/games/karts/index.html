<title>Fans of Karts</title>
<meta name="description" content="Fans of Karts (juego): carreras de karts en pixel art de consola portátil con los líderes de Fans of Rumble. Tres pistas, seis pilotos, objetos con mala idea y Microblizz, que ha comprado la carrera.">

<script>NUCLEO.estilos('../../core/css/base.css', '../../core/css/menus.css', '../../core/css/menus-tienda.css', '../../core/css/menus-extra.css', 'css/tienda.css', 'css/pvp.css')</script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Luckiest+Guy&display=swap">
<style>
/* Prototipo de Fans of Karts: el juego se pinta en una pantalla pequeña de 240 × 160 puntos que se amplía sobre este canvas sin suavizar,
   así cada punto se ve como un cuadradito nítido. Los botones para el dedo se pintan en el mismo canvas. */
html, body { height: 100%; margin: 0; background: #150b21; overflow: hidden; overscroll-behavior: none; }
body { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; touch-action: none; }
#cv { position: fixed; inset: 0; display: block; image-rendering: pixelated; image-rendering: crisp-edges; touch-action: none; cursor: pointer; }
/* no se ve: solo sirve para saber cuánto tapan la muesca y las barras del móvil */
#seguro { position: fixed; inset: 0; visibility: hidden; pointer-events: none; padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
#carga { position: fixed; inset: 0; display: grid; place-items: center; text-align: center; padding: 16px; line-height: 1.6; color: #aca6cf; font: 700 14px/1 ui-monospace, Menlo, Consolas, monospace; letter-spacing: 0.1em; }
[hidden] { display: none !important; }
/* lo de core (cuenta, confirmación y aviso) va encima del lienzo */
#fok-cuenta, #scr-confirm { position: fixed; inset: 0; z-index: 40; font-family: var(--font-ui); }
#scr-confirm { z-index: 41; }   /* la confirmación va encima de la ventana de cuenta (si no, queda detrás y los botones «no hacen nada») */
#toast { position: fixed; top: 12px; z-index: 50; font-family: var(--font-ui); }
/* el caos primordial (energía del PvP): arriba a la derecha, en el menú principal y las pantallas del PvP */
#fok-energia { position: fixed; top: calc(6px + env(safe-area-inset-top)); right: calc(6px + env(safe-area-inset-right)); z-index: 30; display: flex; gap: 6px; align-items: center; font: 700 12px/1.2 var(--font-ui); color: var(--ink, #fff); }
</style>
</head>
<body>
<canvas id="cv" aria-label="Fans of Karts"></canvas>
<div id="seguro"></div>
<div id="carga">…</div>
<script>
// si algo falla al cargar, se dice en pantalla en vez de quedarse en los tres puntos (y recargar suele arreglarlo)
window.addEventListener('error', e => { const c = document.getElementById('carga'); if (c && !c.hidden) c.innerHTML = 'No se ha podido cargar. Recarga la página.<br><small style="opacity:.6">' + String(e.message || '').slice(0, 120) + '</small>'; });
</script>
