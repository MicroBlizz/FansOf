    <div id="pp-camino-ayudas" hidden></div>

      <button class="pp-barra-b" id="pp-camino-equipo" type="button" hidden>EQUIPO</button>
      <button class="pp-barra-b pp-pago" id="pp-camino-tienda" type="button">TIENDA</button>
    </nav>
    <section id="pp-presenta" hidden></section>
    <section id="pp-lola" hidden><div id="pp-lola-cara"></div><div class="pp-bocadillo"><b>Lola</b><p id="pp-lola-texto"></p><button class="pp-btn2" id="pp-lola-vale" type="button">¡VALE!</button><button class="pp-lola-saltar" id="pp-lola-saltar" type="button">Saltar</button></div></section>
    <section id="pp-modal" class="pp-modal" hidden><div class="pp-tarjeta" id="pp-tarjeta"></div></section>
  </div>
</div>
<div id="carga">…</div>
