<script>
// el título de la intro cabe siempre a lo ancho y no tapa la escena: en la app de Android el texto puede salir más grande (el tamaño de letra del móvil),
// así que se mide y, si hace falta, se encoge entero (FANS OF y ROUFLAGE a la vez)
(function () {
  const a = document.querySelector('#carga .cg-arriba'); if (!a) return;
  const ajusta = () => {
    a.style.transform = ''; let w = 0;
    for (const f of a.querySelectorAll('.cg-fila, .cg-fans')) w = Math.max(w, f.scrollWidth);
    const k = Math.min(1, innerWidth * 0.92 / (w || 1), innerHeight * 0.42 / (a.offsetHeight || 1));
    a.style.transform = k < 0.999 ? 'scale(' + k.toFixed(3) + ')' : '';
  };
  ajusta(); addEventListener('resize', ajusta); if (document.fonts && document.fonts.ready) document.fonts.ready.then(ajusta);
})();
</script>
<script>
// cuando el juego está listo, la pantalla de carga no se va sola: pone «TOCA PARA JUGAR» y se quita con el toque (que además deja sonar la música en el móvil). Las pruebas automáticas la quitan como siempre.
(function () {
  const c = document.getElementById('carga'), t = document.getElementById('cg-txt'), real = Object.getOwnPropertyDescriptor(HTMLElement.prototype, 'hidden');
  if (!c || !t || !real || navigator.webdriver) return;
  let idioma = ''; try { idioma = localStorage.getItem('fansof-idioma') || ''; } catch (e) { /* sin guardar */ }
  const en = (idioma || new URLSearchParams(location.search).get('lang') || navigator.language || 'es').slice(0, 2) === 'en';
  if (en) t.textContent = 'LOADING…';
  let esperando = false; const t0 = performance.now(); c.classList.add('cg-sacude');
  // la música de la intro (js/intro-musica.js): intenta sonar ya, a la par que las animaciones (en la app de Android sí; en el navegador del móvil, no hasta tocar)
  if (typeof INTRO_MUSICA !== 'undefined') INTRO_MUSICA.empieza();
  Object.defineProperty(c, 'hidden', { configurable: true, get() { return real.get.call(c); }, set(v) {
    if (!v) { real.set.call(c, false); return; }
    if (esperando) return;
    esperando = true;
    // el «TOCA PARA JUGAR» no sale antes del segundo 3,5 (deja ver la intro entera: letras, colado y becario)
    setTimeout(() => { t.textContent = en ? 'TAP TO PLAY' : 'TOCA PARA JUGAR'; t.classList.add('toca'); }, Math.max(0, 3500 - (performance.now() - t0)));
    const va = e => { if (e) e.preventDefault(); c.removeEventListener('click', va); removeEventListener('keydown', va); if (typeof INTRO_MUSICA !== 'undefined') INTRO_MUSICA.para(); real.set.call(c, true); };
    c.addEventListener('click', va); addEventListener('keydown', va);
  } });
})();
</script>
