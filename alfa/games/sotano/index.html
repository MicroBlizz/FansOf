<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#150b21">
<title>Fans Of Sótano</title>
<meta name="description" content="Fans Of Sótano: baja planta a planta por el sótano de Microblizz y rescata los juegos cancelados. Prototipo en desarrollo.">
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="img/icono-192.png">
<script src="../../core/js/nucleo.js?v=0.1.1-a1184.0918ef8"></script>
<script>NUCLEO.fuentes('../../core/fuentes/baloo-2.css', '../../core/fuentes/luckiest-guy.css')</script>
<!-- ?v= es la versión del prototipo: súbela al cambiarlo -->
<script>NUCLEO.estilos('../../core/css/base.css', 'css/sotano.css')</script>
</head>
<body>
<div id="stage">
  <canvas id="cv" width="540" height="960" aria-label="Fans Of Sótano"></canvas>
  <div id="so-ui">
    <header id="so-hud"></header>
    <div id="so-acciones"></div>
    <nav id="so-pestanas">
      <button class="ol" data-acc="pestana" data-arg="pico">Pico</button>
      <button class="ol" data-acc="pestana" data-arg="materiales">Materiales</button>
      <button class="ol" data-acc="pestana" data-arg="carrera">Carrera</button>
      <button class="ol" data-acc="pestana" data-arg="retos">Retos</button>
      <button class="ol" data-acc="pestana" data-arg="opciones" aria-label="Opciones">···</button>
    </nav>
    <section id="so-panel"></section>
  </div>
</div>
<div id="carga">…</div>
<script>
NUCLEO.juego({
  esperaListo: true,   // la splash de core espera también a NUCLEO.listo(), que js/principal.js llama al arrancar (ADR 091)
  ligero: true,   // solo la cuenta, el idioma y el sonido de core: Sótano lleva su propia partida y sus pantallas (prototipo tras el modo dev, ADR 113)
  antes: ['js/so.js', 'js/ajustes.js'],
  idioma: { en: ['idioma/en-sotano.js'] },
  despues: [
    // la serie: los líderes de las facciones y el castor se dibujan con el arte de core; la música es la de las facciones
    '../../core/js/serie/config.js',
    '../../core/js/serie/facciones/animales.js', '../../core/js/serie/facciones/nomuertos.js', '../../core/js/serie/facciones/streamers.js', '../../core/js/serie/facciones/heroes.js',
    '../../core/js/serie/facciones/ciber.js', '../../core/js/serie/facciones/memes.js', '../../core/js/serie/facciones/gamer.js', '../../core/js/serie/facciones/olvidados.js',
    '../../core/js/serie/facciones/pop.js', '../../core/js/serie/facciones/microblizz.js', '../../core/js/serie/facciones/phony.js', '../../core/js/serie/facciones/cierre.js',
    '../../core/js/serie/arte/base.js',
    '../../core/js/serie/arte/animales.js', '../../core/js/serie/arte/nomuertos.js', '../../core/js/serie/arte/streamers.js', '../../core/js/serie/arte/heroes.js',
    '../../core/js/serie/arte/ciber.js', '../../core/js/serie/arte/memes.js', '../../core/js/serie/arte/gamer.js', '../../core/js/serie/arte/olvidados.js',
    '../../core/js/serie/arte/pop.js', '../../core/js/serie/arte/microblizz.js', '../../core/js/serie/arte/phony.js', '../../core/js/serie/arte/sprites.js',
    '../../core/js/serie/canciones.js',
    '../../core/js/sistema/retos-ligero.js',   // el sistema común de logros (RETOSL): los datos son de Sótano (js/retos.js)
    // el juego, por capas (docs/calidad/ARQUITECTURA.md): los datos, el dominio, los casos de uso, los adaptadores y la composición
    'js/datos.js', 'js/retos.js',
    'js/dominio/curvas.js', 'js/dominio/bonos.js', 'js/dominio/planta.js', 'js/dominio/partida.js', 'js/dominio/picar.js', 'js/dominio/compras.js',
    'js/dominio/trituradora.js', 'js/dominio/despido.js', 'js/dominio/extras.js',
    'js/aplicacion/motor.js', 'js/aplicacion/casos.js',
    'js/adaptadores/almacen-local.js', 'js/adaptadores/reloj.js', 'js/adaptadores/sonido.js', 'js/adaptadores/retos.js', 'js/adaptadores/textos.js',
    'js/adaptadores/arte.js', 'js/adaptadores/escena.js', 'js/adaptadores/efectos.js', 'js/adaptadores/paneles.js', 'js/adaptadores/paneles-carrera.js',
    'js/adaptadores/botones.js',
    'js/principal.js'],
});
</script>
</body>
</html>
