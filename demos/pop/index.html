<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#1a1030">
<title>Fans of Pop</title>
<meta name="description" content="Fans of Pop: revienta burbujas de un pop-it para liberar a los slimes atrapados y llévalos contigo hasta el jefe. Un roguelike de puzles corto, táctil y relajado.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap">
<!-- ?v= es la versión de la demo: súbela al publicar -->
<script src="../../core/js/nucleo.js?v=0.4.0"></script>
<script>NUCLEO.estilos('../../core/css/base.css', '../../core/css/menus.css', 'css/pop.css')</script>
</head>
<body>
<div id="stage">
  <canvas id="cv" width="540" height="960" aria-label="Fans of Pop"></canvas>
  <div id="pp-ui">
    <section id="pp-titulo">
      <p class="pp-lema" id="pp-record"></p>
      <button class="pp-btn pp-enorme" id="pp-seguir" type="button" hidden>SEGUIR</button>
      <button class="pp-btn pp-enorme" id="pp-jugar" type="button">JUGAR</button>
      <div class="pp-fila">
        <button class="pp-btn2 pp-rosa" id="pp-duelo" type="button">DUELOS</button>
        <button class="pp-btn2 pp-azul" id="pp-memoria" type="button">MEMORIA</button>
      </div>
      <div class="pp-fila">
        <button class="pp-btn2 pp-verde" id="pp-ranking" type="button">RANKING</button>
        <button class="pp-btn2 pp-azul" id="pp-opciones" type="button">OPCIONES</button>
      </div>
    </section>
    <button id="pp-pausa" class="pp-redondo" type="button" aria-label="Pausa" hidden><span></span><span></span></button>
    <button id="pp-listo" class="pp-btn" type="button" hidden>¡LISTO!</button>
    <div id="pp-ayudas" hidden></div>
    <div id="pp-lateral" hidden></div>
    <section id="pp-lola" hidden><div id="pp-lola-cara"></div><div class="pp-bocadillo"><b>Lola</b><p id="pp-lola-texto"></p><button class="pp-btn2" id="pp-lola-vale" type="button">¡VALE!</button><div id="pp-lola-elige" hidden><button class="pp-btn2 pp-rosa" id="pp-lola-liso" type="button">LISITOS</button><button class="pp-btn2 pp-azul" id="pp-lola-pixel" type="button">PIXEL ART</button></div></div></section>
    <section id="pp-modal" class="pp-modal" hidden><div class="pp-tarjeta" id="pp-tarjeta"></div></section>
  </div>
</div>
<div id="carga">…</div>
<script>
NUCLEO.juego({
  ligero: true,   // solo la cuenta, el idioma y el sonido de core: Fans of Pop lleva su propia partida y sus pantallas
  antes: ['js/ajustes.js'],
  idioma: { en: ['idioma/en.js'] },
  despues: ['../../core/js/serie/canciones.js', 'js/guardado.js', 'js/sprites.js', 'js/sonidos.js', 'js/niveles.js', 'js/tablero.js', 'js/monedero.js', 'js/tienda.js', 'js/potenciadores.js', 'js/ofertas.js', 'js/pase.js', 'js/partida.js', 'js/nimnivel.js', 'js/efectos.js', 'js/pintar.js', 'js/bandeja.js', 'js/mapa.js', '../../core/js/sistema/salas.js', 'js/duelo.js', 'js/pvp.js', 'js/ranking.js', 'js/memoria.js', 'js/pantallas.js', 'js/novedades.js', 'js/dev.js', 'js/principal.js'],
});
</script>
</body>
</html>
