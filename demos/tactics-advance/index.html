<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0c0818">
<title>Fans of Tactics Advance</title>
<meta name="description" content="Fans of Tactics Advance (prototipo jugable): combate táctico por casillas en pixel art de consola portátil, con CrazyBunny contra Microblizz.">
<link rel="icon" type="image/png" href="../../core/img/icon-192.png">
<style>
/* Prototipo de Fans of Tactics Advance: el juego ocupa toda la pantalla. Se dibuja en dos lienzos pequeños (el mundo y las
   ventanas) que se amplían un número entero de veces sobre este canvas, así que cada píxel se ve nítido. */
html, body { height: 100%; margin: 0; background: #0c0818; overflow: hidden; overscroll-behavior: none; }
body { -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; touch-action: none; }
#cv { position: fixed; inset: 0; display: block; image-rendering: pixelated; image-rendering: crisp-edges; touch-action: none; cursor: pointer; }
#carga { position: fixed; inset: 0; display: grid; place-items: center; color: #aca6cf; font: 700 14px/1 ui-monospace, Menlo, Consolas, monospace; letter-spacing: 0.1em; }
[hidden] { display: none !important; }
</style>
</head>
<body>
<canvas id="cv" data-tr-aria aria-label="Fans of Tactics Advance"></canvas>
<div id="carga">…</div>
<script src="js/textos.js"></script>
<script src="js/pixel.js"></script>
<script src="js/personajes.js"></script>
<script src="js/decorados.js"></script>
<script src="js/mapa.js"></script>
<script src="js/escenas.js"></script>
<script src="js/fondo.js"></script>
<script src="js/letras.js"></script>
<script src="js/ventanas.js"></script>
<script src="js/reglas.js"></script>
<script src="js/dibujo.js"></script>
<script src="js/interfaz.js"></script>
<script src="js/pantallas.js"></script>
<script src="js/juego.js"></script>
<script src="js/controles.js"></script>
<script src="js/principal.js"></script>
</body>
</html>
