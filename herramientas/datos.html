<!doctype html>
<meta charset="utf-8">
<title>Datos del juego</title>
<!-- Lo abre herramientas/subir_datos.py (en Chrome sin ventana): carga el juego, saca de él las cifras que el servidor necesita
     (probabilidades, costes, calidades, qué sale de cada rareza) y se las manda a la herramienta. No es una página para jugadores. -->
<iframe id="j" style="width:800px;height:600px"></iframe>
<script>
'use strict';
// cartas: solo las que salen del gashapón de cartas
const juego = new URLSearchParams(location.search).get('juego');
const f = document.getElementById('j');
f.onload = () => setTimeout(() => {
  let out;
  try {
    out = f.contentWindow.eval(`(() => {
      const g = n => { try { return eval(n); } catch (e) { return undefined; } };
      const E = g('ECON') || {}, R = {};
      for (const k of ['pull', 'odds', 'cardOdds', 'pityEpic', 'pityLeg', 'pityQ', 'scrap', 'reroll', 'goldCost', 'xpNeed', 'maxLvl', 'maxStars', 'dupGems', 'lvlStep', 'start', 'winXpMult', 'xpPerPlay']) if (E[k] !== undefined) R[k] = E[k];
      const cat = DB => { const o = {}; for (const id in DB || {}) { const d = DB[id]; o[id] = { rar: d.rar, slot: d.slot || null, fac: d.fac || null, pass: !!d.pass, n: (d.st || [(d.vals || [1])[1]]).length }; } return o; };
      const premios = () => { const S = g('SHOP') || {}, CD = g('CDIFF') || {}; return { camp: E.camp || null, pay: Object.fromEntries(Object.entries(CD).map(([k, v]) => [k, v.pay || 1])), campRegla: (g('AJUSTES') || {}).campRegla || 'ultimo',
        mundos: (g('WORLDS') || g('WORLDS_TD') || []).map(w => ({ openAfter: w.openAfter || null, niveles: w.levels.length, jefe: w.levels.findIndex(l => l.boss) + 1 || null })), mision: { d: (E.mission || null), w: [g('ECON_W').gold, g('ECON_W').gems], xp: { d: g('PASS').xpDaily, w: g('PASS').xpWeekly }, n: { d: g('DAILY_N'), w: g('WEEKLY_N') }, r: Object.fromEntries([...(g('FIJAS') || []), ...(g('MISSIONS') || []), ...(g('WEEKLY') || [])].filter(m => m.r).map(m => [m.id, m.r])) } ,
        misiones: { d: [...(g('FIJAS') || []), ...(g('MISSIONS') || [])].map(m => m.id), w: (g('WEEKLY') || []).map(m => m.id) },
        login: g('LOGIN') || null,
        logros: Object.fromEntries((g('ACHF') || []).map(f => [f.id, f.gems])),
        pase: g('PASS') ? { levels: g('PASS').levels, xpPer: g('PASS').xpPer, xpWin: g('PASS').xpWin, xpLose: g('PASS').xpLose,
          free: Array.from({ length: g('PASS').levels }, (_, i) => { const r = g('passReward')('free', i + 1); return { gold: r.gold || 0, gems: r.gems || 0, tickets: r.tickets || 0, item: r.item || null }; }),
          paid: Array.from({ length: g('PASS').levels }, (_, i) => { const r = g('passReward')('paid', i + 1); return { gold: r.gold || 0, gems: r.gems || 0, tickets: r.tickets || 0, item: r.item || null }; }), q: g('PASS_Q') } : null,
        horas: g('IDLE') ? { cap: g('IDLE').cap, gold: g('IDLE').gold, gExp: g('IDLE').gExp, gems: g('IDLE').gems, gemsK: g('IDLE').gemsK, item: g('IDLE').item, itemK: g('IDLE').itemK, pwMax: ((g('AJUSTES') || {}).horas || {}).pwMax || 12, turboH: g('ADS') ? g('ADS').turboH : 2, idleH: g('ADS') ? g('ADS').idleH : 4 } : null,
        anuncios: g('ADS') ? { dayMax: g('ADS').dayMax, slots: Object.fromEntries(Object.entries(g('ADS').slots).map(([k, v]) => [k, v.max])) } : null,
        facItems: g('FAC_ITEM') || null,
        gift: S.gift || null, starter: S.starter ? { gold: S.starter.gold, gems: S.starter.gems } : null }; };
      const F = {}; for (const f of g('FACTION_ORDER') || []) { const x = g('FACTIONS')[f]; F[f] = { leader: x.leader || null, units: x.units || [], gacha: x.gacha || [] }; }
      const cartas = {}; const C = (g('CFG') || {}).cards || {}; for (const k in C) if (C[k].gacha) cartas[k] = { rarity: C[k].rarity, fac: C[k].fac || null, cost: C[k].cost == null ? null : C[k].cost };
      return JSON.stringify({ juego: ${JSON.stringify(juego)}, econ: R, calidades: g('QTIERS'), habilidades: cat(g('ABILITIES')), objetos: cat(g('ITEMS')), facciones: F, cartas, orden: g('FACTION_ORDER'), topes: g('ECO').topes(), premios: premios() });
    })()`);
  } catch (e) { out = JSON.stringify({ fallo: String(e) }); }
  fetch('/datos-resultado', { method: 'POST', body: out });
}, 3000);
f.src = '/games/' + juego + '/';
</script>
